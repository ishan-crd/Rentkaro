kind = "web"
previewPath = "/"
title = "RentKaro"
version = "1.0.0"
id = "artifacts/rentkaro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22318

[services.development]
run = "pnpm --filter @workspace/rentkaro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rentkaro", "run", "build" ]
publicDir = "artifacts/rentkaro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22318"
BASE_PATH = "/"
